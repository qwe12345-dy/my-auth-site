<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的钱包 - 创造工坊</title>
<script src="assets/auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; background:#f0f2f8; }
input,button { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }
.app-bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(135deg,#e8ecf5 0%,#f0f2f8 40%,#f5f0f8 100%); overflow:hidden; }
.app-bg::before { content:''; position:absolute; top:-100px; right:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(120,140,255,.25) 0%,transparent 70%); border-radius:50%; }
.edit-header { background:rgba(255,255,255,.85); backdrop-filter:blur(10px); padding:14px 16px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
.edit-header .back { font-size:20px; color:#333; margin-right:12px; cursor:pointer; }
.edit-header h2 { font-size:17px; font-weight:600; }
.wallet-content { padding:20px 16px; }
.balance-card { background:linear-gradient(135deg,#1a237e,#283593); border-radius:20px; padding:30px 24px; color:#fff; box-shadow:0 8px 24px rgba(26,35,126,.3); margin-bottom:20px; position:relative; overflow:hidden; }
.balance-card::after { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; background:radial-gradient(circle,rgba(255,215,0,.2) 0%,transparent 70%); border-radius:50%; }
.balance-label { font-size:14px; opacity:.8; margin-bottom:8px; }
.balance-row { display:flex; align-items:center; gap:12px; }
.balance-icon { width:48px; height:48px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:#1a237e; box-shadow:0 2px 8px rgba(0,0,0,.2); }
.balance-icon img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.balance-num { font-size:36px; font-weight:700; }
.balance-unit { font-size:16px; opacity:.8; margin-left:4px; }
.get-btn { width:100%; padding:16px; background:linear-gradient(135deg,#ffd700,#ffb300); color:#1a237e; border:none; border-radius:12px; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(255,179,0,.4); margin-bottom:16px; }
.get-btn:active { transform:scale(.98); }
.get-btn:disabled { background:#ccc; color:#999; box-shadow:none; }
.tip-card { background:rgba(255,255,255,.8); backdrop-filter:blur(10px); border-radius:12px; padding:14px 16px; font-size:13px; color:#666; line-height:1.6; }
.tip-card b { color:#333; }
.ad-overlay { display:none; position:fixed; inset:0; background:#000; z-index:999; flex-direction:column; }
.ad-overlay.show { display:flex; }
.ad-header { background:#111; color:#fff; height:50px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 14px; position:relative; }
.ad-header .ad-tag { display:flex; align-items:center; gap:5px; font-size:13px; color:#aaa; width:33%; }
.ad-header .ad-title { position:absolute; left:50%; transform:translateX(-50%); font-size:16px; font-weight:600; color:#fff; white-space:nowrap; }
.ad-header .ad-x { width:33%; display:flex; justify-content:flex-end; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:0; line-height:1; opacity:.35; }
.ad-header .ad-x.ready { opacity:1; }
.ad-container { flex:1; position:relative; overflow:hidden; background:#fff; touch-action:pan-y; min-height:0; }
.ad-slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:opacity .2s ease; }
.ad-slide iframe { transform:scale(1.8); transform-origin:center center; max-width:none !important; border:none; }
.ad-slide > div { transform:scale(1.8); transform-origin:center center; }
.ad-slide video.ad-video { width:100%; height:100%; object-fit:contain; background:#000; border:none; transform:none; }
.ad-loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#fff; z-index:5; }
.ad-spinner { width:40px; height:40px; border:4px solid #eee; border-top-color:#4a7dff; border-radius:50%; animation:adspin .8s linear infinite; }
@keyframes adspin { to { transform:rotate(360deg); } }
.ad-loading .lt { font-size:14px; color:#999; }
.ad-loading .retry { margin-top:4px; padding:8px 22px; border:1px solid #4a7dff; background:#fff; color:#4a7dff; border-radius:20px; font-size:13px; cursor:pointer; display:none; }
.ad-bottom { background:#111; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); flex-shrink:0; }
.ad-progress { height:4px; background:#333; border-radius:2px; overflow:hidden; margin-bottom:10px; }
.ad-progress-bar { height:100%; width:100%; background:linear-gradient(90deg,#4caf50,#8bc34a); transform-origin:left center; transform:scaleX(0); }
.ad-reward-btn { width:100%; padding:14px; background:linear-gradient(135deg,#4caf50,#388e3c); color:#fff; border:none; font-size:16px; font-weight:600; cursor:pointer; border-radius:10px; }
.ad-reward-btn:active { transform:scale(.98); }
.ad-reward-btn:disabled { background:#3a3a3a; color:#888; }
.ad-hint { text-align:center; color:#bbb; font-size:12px; margin-bottom:8px; }
.custom-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
.custom-modal.show { display:flex; }
.custom-modal-box { background:#fff; border-radius:16px; padding:24px; width:80%; max-width:300px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.2); }
.custom-modal-box h3 { font-size:17px; margin-bottom:12px; color:#333; }
.custom-modal-box p { font-size:14px; color:#666; margin-bottom:20px; line-height:1.5; }
.custom-modal-btns { display:flex; gap:10px; justify-content:center; }
.custom-modal-btns button { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.custom-modal-btns .btn-ok { background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; }
.reward-amount { font-size:40px; font-weight:700; color:#ff9800; margin:10px 0; }
</style>
</head>
<body>
<div class="app-bg"></div>
<div class="edit-header">
  <span class="back" onclick="history.back()">←</span>
  <h2>我的钱包</h2>
</div>
<div class="wallet-content">
  <div class="balance-card">
    <div class="balance-label">R币余额</div>
    <div class="balance-row">
      <div class="balance-icon"><img src="assets/rcoin.png" onerror="this.style.display='none';this.parentElement.textContent='$'"></div>
      <div>
        <span class="balance-num" id="balance">0</span>
        <span class="balance-unit">R币</span>
      </div>
    </div>
  </div>
  <button class="get-btn" onclick="showAd()">🎬 看广告获取R币</button>
  <div class="tip-card">
    <b>获取规则：</b><br>
    · 每观看1次广告，可获得 <b>20~60</b> 随机R币<br>
    · 看完整个广告视频后即可领取奖励<br>
    · 中途关闭无法获得奖励<br>
    · R币可用于平台内各种消费和兑换
  </div>
</div>

<div class="ad-overlay" id="adOverlay">
  <div class="ad-header">
    <span class="ad-tag">📶 广告</span>
    <span class="ad-title" id="adTitle">播放广告</span>
    <button class="ad-x" id="adCloseBtn" onclick="closeAd()">✕</button>
  </div>
  <div class="ad-container" id="adContainer">
    <div class="ad-slide" id="adSlide"></div>
    <div class="ad-loading" id="adLoading">
      <div class="ad-spinner"></div>
      <div class="lt" id="adLoadingText">广告加载中...</div>
      <button class="retry" id="adRetryBtn" onclick="retryAd()">重新加载</button>
    </div>
  </div>
  <div class="ad-bottom">
    <div class="ad-progress"><div class="ad-progress-bar" id="adProgressBar"></div></div>
    <div class="ad-hint" id="adHint">观看广告后即可领取奖励，左右滑动切换</div>
    <button class="ad-reward-btn" id="adRewardBtn" disabled onclick="claimReward()">🎉 领取奖励（<span id="adCountdown">30</span>s）</button>
  </div>
</div>

<div class="custom-modal" id="rewardModal">
  <div class="custom-modal-box">
    <h3>🎉 恭喜获得</h3>
    <div class="reward-amount" id="rewardAmount">+0</div>
    <p>R币已存入钱包</p>
    <div class="custom-modal-btns">
      <button class="btn-ok" onclick="closeRewardModal()">确定</button>
    </div>
  </div>
</div>

<div class="custom-modal" id="alertModal">
  <div class="custom-modal-box">
    <h3>提示</h3>
    <p id="alertMsg"></p>
    <div class="custom-modal-btns">
      <button class="btn-ok" onclick="closeAlert()">确定</button>
    </div>
  </div>
</div>

<script>
let currentBalance = 0;

async function loadBalance() {
  try {
    const r = await fetch('/api/get_balance', { credentials: 'include' });
    const d = await r.json();
    if (d.success) {
      currentBalance = d.balance;
      document.getElementById('balance').textContent = d.balance;
    }
  } catch (e) {}
}

const adList = [
  { type:'vast', url:'https://smooth-survey.com/d/m/FMz.d/GYNAvNZyG/U_/CeLmi9YuZZeUNlvk/PPTscd0bMZz/gKxJOlTFMztdNGz/QfzgOzDDEL5/NdyjZjsGaEWx1_pcd/DO0FxM' },
  { type:'vast', url:'https://smooth-survey.com/dcmdF.zTdcGvNzvEZ/GMUM/cehmv9huvZ/UrlIkDPOT/c/0IMBzpgkx/N/j/k/tDN/zcQvzNOuDjEp3KM/y/ZislakWG1cpQdmD/0Yxq' },
  { type:'vast', url:'https://smooth-survey.com/d/m-Faz/d.GMNIvRZ/GqUL/we/mw9/ucZZURl/kRP/TScv0IMszpgGx/N/j/kjthNuzKQmzqOoDEEy3vMawD' },
  { type:'vast', url:'https://zesty-career.com/dLm.Fwz/dkGMN/vuZRGAU-/XeomC9iuZZ/UllSkBPoT-cG0rMnz/guy/MXzWcztSN_zJQxzbOsDkIt0GMiQK' },
  { type:'vast', url:'https://zesty-career.com/d/m/Fuz/d.GcN/vHZXGoUh/Uefml9huOZgU/lbkUPITucs0/MlzEgFy/MizLcPtrNNz/QFz/OcD_I/0YMISyZts/aIWJ1apkdCDC0/xk' }
];

let adTimer = null;
let adFinished = false;
let currentAdIndex = 0;
let touchStartX = 0;
let touchStartY = 0;
let adObserveTimer = null;
let adFailCount = 0;

function setLoading(failed) {
  const loading = document.getElementById('adLoading');
  loading.style.display = 'flex';
  document.getElementById('adLoadingText').textContent = failed ? '广告加载失败，请重试' : '广告加载中...';
  document.getElementById('adRetryBtn').style.display = failed ? 'block' : 'none';
  document.querySelector('.ad-spinner').style.display = failed ? 'none' : 'block';
}
function hideLoading() {
  document.getElementById('adLoading').style.display = 'none';
}

function loadAd(index) {
  clearInterval(adTimer);
  adFinished = false;
  const ad = adList[index];
  if (ad.type === 'vast') {
    playVastAd(ad.url);
  } else {
    loadScriptAd(ad.code);
  }
}

function loadScriptAd(code) {
  const slide = document.getElementById('adSlide');
  setLoading(false);
  slide.style.opacity = '0';
  slide.innerHTML = '';
  clearInterval(adObserveTimer);
  setTimeout(() => {
    slide.innerHTML = code;
    const scripts = slide.querySelectorAll('script');
    scripts.forEach(oldScript => {
      const newScript = document.createElement('script');
      if (oldScript.src) newScript.src = oldScript.src;
      if (oldScript.async) newScript.async = true;
      if (oldScript.getAttribute('data-cfasync')) newScript.setAttribute('data-cfasync', oldScript.getAttribute('data-cfasync'));
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
    slide.style.opacity = '1';

    let waited = 0;
    adObserveTimer = setInterval(() => {
      waited += 500;
      const iframe = slide.querySelector('iframe');
      if (iframe && iframe.offsetWidth > 0 && iframe.offsetHeight > 0) {
        clearInterval(adObserveTimer);
        adFailCount = 0;
        hideLoading();
        startBannerCountdown();
      } else if (waited >= 9000) {
        clearInterval(adObserveTimer);
        adFailCount++;
        if (adFailCount < adList.length) {
          currentAdIndex = (currentAdIndex + 1) % adList.length;
          loadAd(currentAdIndex);
        } else {
          adFailCount = 0;
          setLoading(true);
        }
      }
    }, 500);
  }, 150);
}

function nextAdOrFail() {
  adFailCount++;
  if (adFailCount < adList.length) {
    currentAdIndex = (currentAdIndex + 1) % adList.length;
    loadAd(currentAdIndex);
  } else {
    adFailCount = 0;
    setLoading(true);
  }
}

async function playVastAd(url) {
  const slide = document.getElementById('adSlide');
  setLoading(false);
  slide.style.opacity = '0';
  slide.innerHTML = '';
  clearInterval(adObserveTimer);
  try {
    const resp = await fetch('/api/vast?url=' + encodeURIComponent(url));
    const text = await resp.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');

    const imp = xml.querySelector('Impression');
    if (imp && imp.textContent) new Image().src = imp.textContent;

    const mfs = xml.querySelectorAll('MediaFile');
    let videoUrl = '';
    for (const mf of mfs) {
      if ((mf.getAttribute('type') || '').indexOf('mp4') >= 0) { videoUrl = mf.textContent; break; }
    }
    if (!videoUrl && mfs.length) videoUrl = mfs[0].textContent;
    if (!videoUrl) throw new Error('no video');

    const video = document.createElement('video');
    video.className = 'ad-video';
    video.src = videoUrl;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    slide.appendChild(video);
    slide.style.opacity = '1';

    video.addEventListener('play', () => {
      video.muted = false;
      video.volume = 1;
      xml.querySelectorAll('Tracking[event="start"]').forEach(t => new Image().src = t.textContent);
      hideLoading();
      startVideoProgress(video);
    });
    video.addEventListener('ended', () => {
      xml.querySelectorAll('Tracking[event="complete"]').forEach(t => new Image().src = t.textContent);
      finishAd();
    });
    video.play().catch(() => {});

    let waited = 0;
    adObserveTimer = setInterval(() => {
      waited += 500;
      if (video.readyState >= 2) {
        clearInterval(adObserveTimer);
        adFailCount = 0;
        hideLoading();
      } else if (waited >= 9000) {
        clearInterval(adObserveTimer);
        nextAdOrFail();
      }
    }, 500);
  } catch (e) {
    nextAdOrFail();
  }
}

function retryAd() {
  adFailCount = 0;
  currentAdIndex = Math.floor(Math.random() * adList.length);
  loadAd(currentAdIndex);
}

function setBar(p) {
  const bar = document.getElementById('adProgressBar');
  bar.style.transition = 'none';
  bar.style.transform = 'scaleX(' + p + ')';
}

function finishAd() {
  if (adFinished) return;
  adFinished = true;
  clearInterval(adTimer);
  setBar(1);
  const btn = document.getElementById('adRewardBtn');
  btn.disabled = false;
  btn.innerHTML = '🎉 领取奖励';
  document.getElementById('adCloseBtn').classList.add('ready');
  document.getElementById('adTitle').textContent = '恭喜获得奖励！';
  document.getElementById('adHint').textContent = '广告观看完成，可领取奖励';
}

function startBannerCountdown() {
  clearInterval(adTimer);
  let count = 20;
  const btn = document.getElementById('adRewardBtn');
  btn.innerHTML = '🎉 领取奖励（<span id="adCountdown">20</span>s）';
  setBar(0);
  adTimer = setInterval(() => {
    count--;
    setBar((20 - count) / 20);
    const cd = document.getElementById('adCountdown');
    if (cd) cd.textContent = count > 0 ? count : 0;
    if (count <= 0) finishAd();
  }, 1000);
}

function startVideoProgress(video) {
  clearInterval(adTimer);
  const btn = document.getElementById('adRewardBtn');
  btn.innerHTML = '🎉 播放中';
  setBar(0);
  video.ontimeupdate = () => {
    const d = video.duration;
    if (!isNaN(d) && d > 0) {
      setBar(Math.min(1, video.currentTime / d));
      if (video.currentTime >= d - 0.5) finishAd();
    }
  };
}

function showAd() {
  adFinished = false;
  adFailCount = 0;
  currentAdIndex = Math.floor(Math.random() * adList.length);
  document.getElementById('adOverlay').classList.add('show');
  const btn = document.getElementById('adRewardBtn');
  btn.disabled = true;
  btn.innerHTML = '🎉 领取奖励';
  document.getElementById('adCloseBtn').classList.remove('ready');
  document.getElementById('adTitle').textContent = '播放广告';
  document.getElementById('adHint').textContent = '观看广告后即可领取奖励';
  setBar(0);
  loadAd(currentAdIndex);
}

const adContainer = document.getElementById('adContainer');
adContainer.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

adContainer.addEventListener('touchend', function(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 50) return;
  if (absDx > absDy) {
    currentAdIndex = dx < 0 ? (currentAdIndex + 1) % adList.length : (currentAdIndex - 1 + adList.length) % adList.length;
  } else {
    currentAdIndex = dy < 0 ? (currentAdIndex + 1) % adList.length : (currentAdIndex - 1 + adList.length) % adList.length;
  }
  loadAd(currentAdIndex);
}, { passive: true });

async function claimReward() {
  if (!adFinished) {
    showAlert('请先看完广告再领取奖励');
    return;
  }
  const btn = document.getElementById('adRewardBtn');
  btn.disabled = true;
  btn.textContent = '领取中...';
  try {
    const r = await fetch('/api/add_coins', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include'
    });
    const d = await r.json();
    if (d.success) {
      currentBalance = d.balance;
      document.getElementById('balance').textContent = d.balance;
      document.getElementById('rewardAmount').textContent = '+' + d.amount;
      document.getElementById('rewardModal').classList.add('show');
      document.getElementById('adOverlay').classList.remove('show');
      clearInterval(adObserveTimer);
      document.getElementById('adSlide').innerHTML = '';
    } else {
      showAlert(d.message);
    }
  } catch (e) {
    showAlert('领取失败，请重试');
  }
  btn.disabled = false;
  btn.textContent = '🎉 领取奖励';
}

function closeAd() {
  if (!adFinished) {
    document.getElementById('adHint').textContent = '请先看完广告，暂不能关闭';
    return;
  }
  if (adTimer) clearInterval(adTimer);
  clearInterval(adObserveTimer);
  document.getElementById('adOverlay').classList.remove('show');
  document.getElementById('adSlide').innerHTML = '';
}

function closeRewardModal() {
  document.getElementById('rewardModal').classList.remove('show');
}

function showAlert(msg) {
  document.getElementById('alertMsg').textContent = msg;
  document.getElementById('alertModal').classList.add('show');
}

function closeAlert() {
  document.getElementById('alertModal').classList.remove('show');
}

loadBalance();
</script>
</body>
</html>
