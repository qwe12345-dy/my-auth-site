<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>游戏中 - 创造工坊</title>
<script src="assets/auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#gameFrame { width:100%; height:100%; border:none; display:block; }
.close-btn { position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; font-size:20px; cursor:pointer; z-index:999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
.close-btn:active { background:rgba(0,0,0,.8); }
.loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; background:#1a1a1a; z-index:1; }
.spinner { width:36px; height:36px; border:3px solid #333; border-top-color:#4a7dff; border-radius:50%; animation:spin 1s linear infinite; margin-right:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div>加载游戏中...</div>
<button class="close-btn" onclick="closeGame()">✕</button>
<iframe id="gameFrame"></iframe>
<script>
const urlParams = new URLSearchParams(window.location.search);
const gameId = urlParams.get('id');

async function loadGame() {
  if (!gameId) { document.getElementById('loading').textContent = '游戏不存在'; return; }
  try {
    const r = await fetch('/api/game?id=' + gameId, { credentials: 'include' });
    const d = await r.json();
    if (!d.success) {
      document.getElementById('loading').textContent = d.message;
      return;
    }
    const frame = document.getElementById('gameFrame');
    frame.srcdoc = d.game.html_code;
    frame.onload = function() {
      document.getElementById('loading').style.display = 'none';
    };
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 3000);
  } catch (e) {
    document.getElementById('loading').textContent = '加载失败';
  }
}

function closeGame() {
  if (history.length > 1) { history.back(); }
  else { location.href = 'index.html'; }
}

loadGame();
</script>
</body>
</html>
