<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>主页 - 创造工坊</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; padding-bottom:90px; background:#f0f2f8; }
input,button,textarea { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }

.app-bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(135deg,#e8ecf5 0%,#f0f2f8 40%,#f5f0f8 100%); overflow:hidden; }
.app-bg::before { content:''; position:absolute; top:-100px; right:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(120,140,255,.25) 0%,transparent 70%); border-radius:50%; }
.app-bg::after { content:''; position:absolute; bottom:100px; left:-60px; width:280px; height:280px; background:radial-gradient(circle,rgba(255,200,120,.2) 0%,transparent 70%); border-radius:50%; }

.hamburger { position:absolute; top:16px; left:16px; width:32px; height:32px; display:flex; flex-direction:column; justify-content:center; gap:5px; cursor:pointer; z-index:10; }
.hamburger span { display:block; width:22px; height:2.5px; background:#333; border-radius:2px; }

.profile-page { padding:60px 20px 20px; position:relative; }
.profile-top { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
.profile-avatar-lg { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#fff; flex-shrink:0; overflow:hidden; border:3px solid rgba(255,255,255,.8); box-shadow:0 4px 12px rgba(0,0,0,.1); }
.profile-avatar-lg img { width:100%; height:100%; object-fit:cover; }
.profile-stats { flex:1; display:flex; justify-content:space-around; text-align:center; }
.profile-stats .stat .num { font-size:22px; font-weight:700; color:#1a1a1a; }
.profile-stats .stat .label { font-size:13px; color:#999; margin-top:2px; }
.profile-name-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.profile-name { font-size:20px; font-weight:700; color:#1a1a1a; }
.profile-tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; }
.profile-bio-text { font-size:14px; color:#666; margin-bottom:16px; line-height:1.6; }

.tabs { display:flex; gap:24px; margin-bottom:16px; border-bottom:1px solid rgba(0,0,0,.06); padding-bottom:0; }
.tabs .tab { font-size:16px; color:#999; padding:8px 0; position:relative; cursor:pointer; font-weight:500; }
.tabs .tab.active { color:#1a1a1a; font-weight:700; }
.tabs .tab.active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:3px; background:#333; border-radius:2px; }

.work-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.work-card { background:#fff; border-radius:16px; overflow:hidden; aspect-ratio:1; box-shadow:0 2px 10px rgba(0,0,0,.05); position:relative; }
.work-card img { width:100%; height:100%; object-fit:cover; }
.work-card .work-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; background:#f8f9fb; }
.work-empty { grid-column:1/-1; text-align:center; padding:40px 20px; color:#bbb; font-size:14px; }

.bottom-nav { position:fixed; bottom:12px; left:12px; right:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; display:flex; justify-content:space-around; align-items:center; padding:10px 8px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); box-shadow:0 4px 20px rgba(0,0,0,.08); z-index:200; }
.bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 4px; color:#999; font-size:11px; text-decoration:none; border-radius:16px; transition:all .2s; }
.bottom-nav a .icon { font-size:22px; margin-bottom:2px; }
.bottom-nav a.active { color:#1a1a1a; background:rgba(0,0,0,.06); }
.bottom-nav a:active { opacity:.7; }
.bottom-nav .fab { flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 12px rgba(74,125,255,.4); margin:0 4px; }
.bottom-nav .fab:active { transform:scale(.95); }

.auth-page { display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:16px; }
.auth-box { background:#fff; padding:28px 24px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.15); width:100%; max-width:400px; }
.auth-box h2 { text-align:center; margin-bottom:24px; color:#333; font-size:22px; }
.auth-box input { width:100%; padding:14px 16px; margin-bottom:14px; border:1px solid #e0e0e0; border-radius:10px; font-size:16px; background:#fafafa; transition:border-color .2s,background .2s; }
.auth-box input:focus { outline:none; border-color:#667eea; background:#fff; }
.auth-box button { width:100%; padding:14px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; border-radius:10px; font-size:17px; font-weight:600; cursor:pointer; transition:transform .1s; }
.auth-box button:active { transform:scale(.98); }
.auth-box button:disabled { background:#ccc; }
.auth-box p { text-align:center; margin-top:18px; font-size:14px; color:#666; }
.auth-box a { color:#667eea; text-decoration:none; font-weight:500; }
.code-row { display:flex; gap:8px; margin-bottom:14px; }
.code-row input { flex:1; margin-bottom:0; min-width:0; }
.code-row button { width:auto; min-width:110px; white-space:nowrap; font-size:14px; padding:0 12px; background:#667eea; }
.cf-turnstile { margin-bottom:14px; display:flex; justify-content:center; }

.home-page { padding:60px 20px 20px; }
.home-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.home-subtitle { font-size:14px; color:#999; margin-bottom:20px; }
.home-card { background:rgba(255,255,255,.7); backdrop-filter:blur(10px); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
.home-card h3 { font-size:16px; margin-bottom:12px; }
.card-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.mini-card { background:#fff; border-radius:12px; padding:14px; text-align:center; }
.mini-card .icon { font-size:28px; margin-bottom:6px; }
.mini-card .title { font-size:13px; color:#555; }

.create-page { padding:60px 20px 20px; }
.create-hero { text-align:center; padding:30px 0; }
.create-hero .icon { font-size:56px; margin-bottom:12px; }
.create-hero h2 { font-size:22px; margin-bottom:6px; }
.create-hero p { font-size:14px; color:#999; }

.edit-page { background:#f0f2f8; min-height:100vh; padding-bottom:30px; }
.edit-header { background:rgba(255,255,255,.8); backdrop-filter:blur(10px); padding:14px 16px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
.edit-header .back { font-size:20px; color:#333; margin-right:12px; cursor:pointer; }
.edit-header h2 { font-size:17px; font-weight:600; }
.edit-cover-upload { position:relative; width:100%; height:160px; background:#ddd; overflow:hidden; cursor:pointer; }
.edit-cover-upload img { width:100%; height:100%; object-fit:cover; }
.edit-cover-upload .overlay { position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
.edit-avatar-wrap { padding:0 16px; margin-top:-36px; position:relative; z-index:5; }
.edit-avatar-upload { width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:#ddd; overflow:hidden; cursor:pointer; position:relative; }
.edit-avatar-upload img { width:100%; height:100%; object-fit:cover; }
.edit-avatar-upload .overlay { position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
.edit-form { padding:16px; }
.edit-form label { display:block; font-size:14px; color:#666; margin-bottom:6px; margin-top:16px; }
.edit-form textarea { width:100%; padding:12px; border:1px solid #e0e0e0; border-radius:10px; font-size:15px; resize:vertical; min-height:100px; background:#fafafa; }
.edit-form textarea:focus { outline:none; border-color:#667eea; background:#fff; }
.edit-form .char-count { text-align:right; font-size:12px; color:#999; margin-top:4px; }
.edit-form .save-btn { width:100%; padding:14px; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; margin-top:20px; cursor:pointer; }
.edit-form .save-btn:active { transform:scale(.98); }
.edit-form .save-btn:disabled { background:#ccc; }

.msg { padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
.msg.error { background:#fee; color:#c33; }
.msg.success { background:#efe; color:#2a2; }
.loading { text-align:center; padding:60px 20px; color:#999; font-size:15px; }
.bio-status { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; margin-top:6px; }
.bio-status.pending { background:#fff3cd; color:#856404; }
.bio-status.rejected { background:#f8d7da; color:#721c24; }
.bio-status.approved { background:#d4edda; color:#155724; }

@media (max-width:480px) {
  .profile-page { padding:50px 16px 16px; }
  .profile-avatar-lg { width:64px; height:64px; font-size:24px; }
  .profile-stats .stat .num { font-size:20px; }
  .profile-name { font-size:18px; }
  .work-grid { gap:10px; }
  .bottom-nav { bottom:8px; left:8px; right:8px; border-radius:20px; padding:8px 6px; }
  .bottom-nav a .icon { font-size:20px; }
  .bottom-nav .fab { width:48px; height:48px; font-size:24px; }
  .home-page,.create-page { padding:50px 16px 16px; }
}
@media (max-width:360px) {
  .code-row { flex-direction:column; }
  .code-row button { width:100%; min-width:0; padding:12px; }
}

</style>
</head>
<body>
<div class="app-bg"></div>

<div class="home-page">
  <div class="home-title">创造工坊</div>
  <div class="home-subtitle">发现精彩，分享创作</div>

  <div class="home-card">
    <h3>热门分类</h3>
    <div class="card-grid">
      <div class="mini-card"><div class="icon">🎮</div><div class="title">游戏</div></div>
      <div class="mini-card"><div class="icon">🎨</div><div class="title">绘画</div></div>
      <div class="mini-card"><div class="icon">📝</div><div class="title">文章</div></div>
      <div class="mini-card"><div class="icon">🎵</div><div class="title">音乐</div></div>
    </div>
  </div>

  <div class="home-card">
    <h3>推荐作品</h3>
    <div class="work-grid">
      <div class="work-empty">暂无推荐作品</div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span class="icon">🏠</span>主页</a>
  <a href="#"><span class="icon">📊</span>动态</a>
  <a href="#"><span class="icon">👥</span>社区</a>
  <a href="profile.html"><span class="icon">👤</span>我的</a>
  <a href="create.html" class="fab">+</a>
</nav>
</body>
</html>
