<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>主页 - 创造工坊</title>
<script src="assets/auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; padding-bottom:90px; background:#f0f2f8; }
input,button,textarea { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }
.app-bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(135deg,#e8ecf5 0%,#f0f2f8 40%,#f5f0f8 100%); overflow:hidden; }
.app-bg::before { content:''; position:absolute; top:-100px; right:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(120,140,255,.25) 0%,transparent 70%); border-radius:50%; }
.home-page { padding:50px 16px 16px; }
.home-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.home-subtitle { font-size:14px; color:#999; margin-bottom:16px; }
.game-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.game-card { background:#fff; border-radius:16px; overflow:hidden; aspect-ratio:1; box-shadow:0 2px 10px rgba(0,0,0,.05); cursor:pointer; }
.game-card .game-icon { width:100%; height:70%; display:flex; align-items:center; justify-content:center; font-size:40px; background:#f8f9fb; overflow:hidden; }
.game-card .game-icon img { width:100%; height:100%; object-fit:cover; }
.game-card .game-info { padding:8px 10px; }
.game-card .game-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.game-card .game-meta { font-size:11px; color:#999; margin-top:2px; display:flex; gap:8px; }
.game-empty { grid-column:1/-1; text-align:center; padding:60px 20px; color:#bbb; font-size:14px; }
.game-empty img { width:170px; height:170px; object-fit:cover; border-radius:20px; display:block; margin:0 auto 14px; box-shadow:0 8px 24px rgba(102,126,234,.18); }
.game-meta span { display:inline-flex; align-items:center; gap:2px; }
.game-meta img { width:12px; height:12px; object-fit:contain; }
.bottom-nav { position:fixed; bottom:12px; left:12px; right:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; display:flex; justify-content:space-around; align-items:center; padding:10px 8px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); box-shadow:0 4px 20px rgba(0,0,0,.08); z-index:200; }
.bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 4px; color:#999; font-size:11px; text-decoration:none; border-radius:16px; transition:all .2s; }
.bottom-nav a .icon { font-size:22px; margin-bottom:2px; }
.bottom-nav a.active { color:#1a1a1a; background:rgba(0,0,0,.06); }
.bottom-nav a:active { opacity:.7; }
.bottom-nav .fab { flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 12px rgba(74,125,255,.4); margin:0 4px; }
.bottom-nav .fab:active { transform:scale(.95); }
.loading { text-align:center; padding:60px 20px; color:#999; }
.rcoin-display { position:absolute; top:14px; right:16px; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.85); backdrop-filter:blur(10px); padding:6px 12px; border-radius:20px; cursor:pointer; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.rcoin-display img { width:22px; height:22px; border-radius:50%; }
.rcoin-display .num { font-size:14px; font-weight:700; color:#1a237e; }
.search-box { margin:0 16px 12px; position:relative; z-index:5; }
.search-box input { width:100%; padding:10px 14px 10px 38px; border:none; border-radius:12px; background:rgba(255,255,255,.9); font-size:14px; outline:none; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.search-box::before { content:''; position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; background:url(assets/ic-search.png) center/contain no-repeat; opacity:.5; }
.checkin-card { margin:0 16px 14px; background:linear-gradient(135deg,#c0392b,#e74c3c 50%,#d35400); border-radius:16px; padding:16px; color:#fff; position:relative; overflow:hidden; cursor:pointer; box-shadow:0 6px 18px rgba(192,57,43,.35); z-index:5; }
.checkin-card::after { content:''; position:absolute; right:16px; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 34% 32%,#fffbe8,#f6dc74 70%,#ecc548); box-shadow:0 0 18px rgba(255,236,150,.7); opacity:.92; }
.checkin-card .ci-title { font-size:17px; font-weight:700; margin-bottom:4px; }
.checkin-card .ci-sub { font-size:13px; opacity:.92; }
.checkin-card .ci-days { display:flex; gap:8px; margin-top:10px; position:relative; z-index:2; }
.checkin-card .ci-day { background:rgba(255,255,255,.2); border-radius:8px; padding:4px 10px; font-size:12px; }
.checkin-card .ci-day.done { background:rgba(255,215,0,.9); color:#7b3f00; font-weight:700; }
.checkin-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:400; display:none; align-items:center; justify-content:center; }
.checkin-mask.show { display:flex; }
.checkin-modal { background:#fff; border-radius:18px; width:86%; max-width:340px; padding:24px 20px; text-align:center; }
.checkin-modal h3 { font-size:20px; color:#c0392b; margin-bottom:6px; }
.checkin-modal .cm-sub { font-size:13px; color:#999; margin-bottom:18px; }
.checkin-days { display:flex; justify-content:space-between; gap:8px; margin-bottom:18px; }
.checkin-day-item { flex:1; border:2px solid #eee; border-radius:12px; padding:12px 4px; font-size:12px; color:#999; }
.checkin-day-item .cd-date { font-weight:700; font-size:14px; color:#333; margin-bottom:4px; }
.checkin-day-item .cd-reward { color:#e67e22; font-weight:600; }
.checkin-day-item.done { border-color:#f1c40f; background:#fffbe6; }
.checkin-day-item.done .cd-date { color:#b7950b; }
.checkin-day-item.done::after { content:'✓ 已签'; display:block; color:#27ae60; font-size:11px; margin-top:2px; }
.checkin-day-item.today { border-color:#e74c3c; background:#fdf0ef; }
.checkin-btn { width:100%; padding:13px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; }
.checkin-btn:disabled { background:#ccc; }
.checkin-close { width:100%; padding:10px; border:none; background:none; color:#999; font-size:14px; cursor:pointer; margin-top:6px; }

.bottom-nav a .icon img{width:24px;height:24px;display:block}
.bottom-nav a:not(.active) .icon img{filter:grayscale(1);opacity:.4}
.bottom-nav a.active .icon img{filter:none;opacity:1}
.bottom-nav .fab img{width:26px;height:26px;display:block;filter:brightness(0) invert(1)}
@media(max-width:480px){.bottom-nav a .icon img{width:22px;height:22px}.bottom-nav .fab img{width:23px;height:23px}}

</style>
</head>
<body>
<div class="app-bg"></div>
<div class="rcoin-display" onclick="location.href='wallet.html'">
  <img src="assets/rcoin.png" onerror="this.style.display='none'">
  <span class="num" id="rcoinNum">0</span>
</div>
<div class="home-page">
  <div class="home-title">创造工坊</div>
  <div class="home-subtitle">发现精彩游戏，分享你的创作</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索游戏..." oninput="doSearch()">
  </div>
  <div class="checkin-card" id="checkinCard" style="display:none" onclick="openCheckin()">
    <div class="ci-title">中秋签到活动</div>
    <div class="ci-sub" id="checkinSub">点击签到，领取R币奖励</div>
    <div class="ci-days" id="checkinMiniDays"></div>
  </div>
  <div id="loading" class="loading">加载中...</div>
  <div class="game-grid" id="gameGrid" style="display:none"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span class="icon"><img src="assets/nav-home.png" alt=""></span>主页</a>
  <a href="community.html"><span class="icon"><img src="assets/nav-community.png" alt=""></span>社区</a>
  <a href="create.html" class="fab"><img src="assets/nav-create.png" alt=""></a>
  <a href="profile.html"><span class="icon"><img src="assets/nav-me.png" alt=""></span>我的</a>
</nav>

<div class="checkin-mask" id="checkinMask">
  <div class="checkin-modal">
    <h3>中秋签到</h3>
    <div class="cm-sub">9月17日 - 9月20日 限时活动</div>
    <div class="checkin-days" id="checkinDays"></div>
    <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">今日签到</button>
    <button class="checkin-close" onclick="closeCheckin()">关闭</button>
  </div>
</div>

<script>
function escapeHtml(text){
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}

let checkinData = null;

async function loadCheckin(){
  try{
    const r=await fetch('/api/checkin_status',{credentials:'include'});
    if(r.status===401) return;
    const d=await r.json();
    if(!d.success) return;
    checkinData = d;
    const card=document.getElementById('checkinCard');
    if(d.active){
      card.style.display='block';
      const doneCount=d.days.filter(x=>x.checked).length;
      document.getElementById('checkinSub').textContent=d.todayCanCheckin&&!d.todayChecked?'今天可以签到，点击领取'+d.todayReward+' R币':'已签到'+doneCount+'/3天';
      document.getElementById('checkinMiniDays').innerHTML=d.days.map(x=>'<span class="ci-day'+(x.checked?' done':'')+'">9.'+x.day+(x.checked?' ✓':'')+'</span>').join('');
      document.getElementById('checkinDays').innerHTML=d.days.map(x=>{
        const cls=x.checked?'done':(d.todayCanCheckin&&x.day===new Date(Date.now()+8*3600*1000).getUTCDate()?'today':'');
        return '<div class="checkin-day-item '+cls+'"><div class="cd-date">9.'+x.day+'</div><div class="cd-reward">'+x.reward+' R币</div></div>';
      }).join('');
      const btn=document.getElementById('checkinBtn');
      if(d.todayCanCheckin&&!d.todayChecked){
        btn.disabled=false;
        btn.textContent='今日签到 领'+d.todayReward+' R币';
      }else if(d.todayChecked){
        btn.disabled=true;
        btn.textContent='今日已签到';
      }else{
        btn.disabled=true;
        btn.textContent='今天不是签到日';
      }
    }else{
      card.style.display='none';
    }
  }catch(e){}
}

function openCheckin(){
  if(checkinData) document.getElementById('checkinMask').classList.add('show');
}
function closeCheckin(){
  document.getElementById('checkinMask').classList.remove('show');
}

async function doCheckin(){
  const btn=document.getElementById('checkinBtn');
  btn.disabled=true;
  btn.textContent='签到中...';
  try{
    const r=await fetch('/api/checkin_status',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({}),
      credentials:'include'
    });
    const text=await r.text();
    let d;
    try{ d=JSON.parse(text); }catch(e){
      btn.textContent='服务异常('+r.status+')，请重新部署最新代码';
      btn.disabled=false;
      return;
    }
    if(d.success){
      btn.textContent='签到成功 +'+d.reward+' R币';
      loadRcoin();
      loadCheckin();
      setTimeout(closeCheckin,1500);
    }else{
      btn.textContent=d.message||'签到失败';
      setTimeout(loadCheckin,1500);
    }
  }catch(e){
    btn.textContent='网络错误: '+e.message;
    btn.disabled=false;
  }
}

async function loadRcoin(){
  try{
    const r=await fetch('/api/get_balance',{credentials:'include'});
    const d=await r.json();
    if(d.success){
      document.getElementById('rcoinNum').textContent=d.balance;
    }
  }catch(e){}
}

let searchKeyword = '';

async function loadGames(){
  try{
    const url = searchKeyword ? '/api/games?search=' + encodeURIComponent(searchKeyword) : '/api/games';
    const r=await fetch(url);
    const d=await r.json();
    document.getElementById('loading').style.display='none';
    const grid=document.getElementById('gameGrid');
    grid.style.display='grid';
    if(!d.success||d.games.length===0){
      grid.innerHTML='<div class="game-empty">'+(searchKeyword?'没有找到相关游戏':'<img src="assets/empty.jpg" alt="">暂无游戏，点击下方 + 号创作第一个游戏吧')+'</div>';
      return;
    }
    grid.innerHTML=d.games.map(g=>{
      const iconHtml='<img src="'+(g.icon||'assets/default-game.jpg')+'">';
      return '<div class="game-card" onclick="location.href=\'game.html?id='+g.id+'\'">'+
        '<div class="game-icon">'+iconHtml+'</div>'+
        '<div class="game-info">'+
          '<div class="game-title">'+escapeHtml(g.title)+'</div>'+
          '<div class="game-meta"><span><img src="assets/ic-liked.png">'+g.likes_count+'</span><span><img src="assets/ic-play.png">'+(g.play_count||0)+'</span><span><img src="assets/ic-comment.png">'+g.comments_count+'</span></div>'+
        '</div>'+
      '</div>';
    }).join('');
  }catch(e){
    document.getElementById('loading').textContent='加载失败，请刷新';
  }
}

let searchTimer = null;
function doSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    searchKeyword = document.getElementById('searchInput').value.trim();
    loadGames();
  }, 300);
}

loadRcoin();
loadGames();
loadCheckin();

setInterval(loadRcoin, 1100);
setInterval(()=>{
  if(!searchKeyword) loadGames();
}, 1100);

document.addEventListener('visibilitychange', function(){
  if(!document.hidden){
    loadRcoin();
    loadGames();
    loadCheckin();
  }
});
</script>
</body>
</html>
