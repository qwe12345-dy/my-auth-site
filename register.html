<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 - Cloudflare Auth</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
.turnstile-disabled{display:none!important;}
</style>
</head>
<body class="auth-page">
<div class="auth-box">
  <h2>注册</h2>
  <div id="msg"></div>
  <form onsubmit="doRegister(event)">
    <input type="text" id="username" placeholder="用户名(2-20位)" required>
    <input type="email" id="email" placeholder="邮箱" required>
    <div class="code-row">
      <input type="text" id="code" placeholder="邮箱验证码" required maxlength="6">
      <button type="button" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
    </div>
    <input type="password" id="password" placeholder="密码(至少6位)" required>
    <div class="cf-turnstile" id="turnstileWidget" data-sitekey="0x4AAAAAAEz9gJvM8g1yxAIv"></div>
    <button type="submit">注册</button>
  </form>
  <p>已有账号？<a href="login.html">去登录</a></p>
</div>
<script>
const TURNSTILE_SITE_KEY='0x4AAAAAAEz9gJvM8g1yxAIv';
const turnstileEnabled=TURNSTILE_SITE_KEY&&TURNSTILE_SITE_KEY!=='YOUR_TURNSTILE_SITE_KEY';
if(!turnstileEnabled){
  document.getElementById('turnstileWidget').classList.add('turnstile-disabled');
}
let countdown=0;
function showMsg(text,type){
  const el=document.getElementById('msg');
  el.innerHTML='<div class="msg '+type+'">'+text+'</div>';
}
function getTurnstileToken(){
  if(!turnstileEnabled)return '';
  if(typeof turnstile!=='undefined'&&turnstile.getResponse){
    return turnstile.getResponse();
  }
  return '';
}
async function sendCode(){
  const email=document.getElementById('email').value.trim();
  if(!email){showMsg('请先输入邮箱','error');return;}
  if(turnstileEnabled){
    const token=getTurnstileToken();
    if(!token){showMsg('请先完成人机验证','error');return;}
  }
  const btn=document.getElementById('sendCodeBtn');
  btn.disabled=true;
  btn.textContent='发送中...';
  try{
    const r=await fetch('/api/send_code',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,turnstile_token:getTurnstileToken()})
    });
    const d=await r.json();
    if(d.success){
      showMsg(d.message,'success');
      countdown=60;
      const timer=setInterval(()=>{
        countdown--;
        if(countdown<=0){
          clearInterval(timer);
          btn.disabled=false;
          btn.textContent='发送验证码';
        }else{
          btn.textContent=countdown+'秒后重发';
        }
      },1000);
    }else{
      showMsg(d.message,'error');
      btn.disabled=false;
      btn.textContent='发送验证码';
    }
  }catch(e){
    showMsg('发送失败，请重试','error');
    btn.disabled=false;
    btn.textContent='发送验证码';
  }
}
async function doRegister(e){
  e.preventDefault();
  if(turnstileEnabled){
    const token=getTurnstileToken();
    if(!token){showMsg('请先完成人机验证','error');return;}
  }
  const r=await fetch('/api/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({
      username:document.getElementById('username').value,
      email:document.getElementById('email').value,
      password:document.getElementById('password').value,
      code:document.getElementById('code').value,
      turnstile_token:getTurnstileToken()
    })
  });
  const d=await r.json();
  if(d.success){
    showMsg('注册成功，正在跳转...','success');
    setTimeout(()=>location.href='index.html',800);
  }else{
    showMsg(d.message,'error');
  }
}
</script>
</body>
</html>
