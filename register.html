<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 - Cloudflare Auth</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
<div class="auth-box">
  <h2>注册</h2>
  <div id="msg"></div>
  <form onsubmit="doRegister(event)">
    <input type="text" id="username" placeholder="用户名(2-20位)" required>
    <input type="email" id="email" placeholder="邮箱" required>
    <input type="password" id="password" placeholder="密码(至少6位)" required>
    <button type="submit">注册</button>
  </form>
  <p>已有账号？<a href="login.html">去登录</a></p>
</div>
<script>
function showMsg(text,type){
  const el=document.getElementById('msg');
  el.innerHTML='<div class="msg '+type+'">'+text+'</div>';
}
async function doRegister(e){
  e.preventDefault();
  const r=await fetch('/api/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({
      username:document.getElementById('username').value,
      email:document.getElementById('email').value,
      password:document.getElementById('password').value
    })
  });
  const d=await r.json();
  if(d.success){
    showMsg('注册成功，正在跳转...','success');
    setTimeout(()=>location.href='index.html',800);
  }else{
    showMsg(d.message,'error');
  }
}
</script>
</body>
</html>
