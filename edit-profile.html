<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人资料 - 创造工坊</title>
<script src="assets/auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; padding-bottom:90px; background:#f0f2f8; }
input,button,textarea { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }

.app-bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(135deg,#e8ecf5 0%,#f0f2f8 40%,#f5f0f8 100%); overflow:hidden; }
.app-bg::before { content:''; position:absolute; top:-100px; right:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(120,140,255,.25) 0%,transparent 70%); border-radius:50%; }
.app-bg::after { content:''; position:absolute; bottom:100px; left:-60px; width:280px; height:280px; background:radial-gradient(circle,rgba(255,200,120,.2) 0%,transparent 70%); border-radius:50%; }

.hamburger { position:absolute; top:16px; left:16px; width:32px; height:32px; display:flex; flex-direction:column; justify-content:center; gap:5px; cursor:pointer; z-index:10; }
.hamburger span { display:block; width:22px; height:2.5px; background:#333; border-radius:2px; }

.profile-page { padding:60px 20px 20px; position:relative; }
.profile-top { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
.profile-avatar-lg { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#fff; flex-shrink:0; overflow:hidden; border:3px solid rgba(255,255,255,.8); box-shadow:0 4px 12px rgba(0,0,0,.1); }
.profile-avatar-lg img { width:100%; height:100%; object-fit:cover; }
.profile-stats { flex:1; display:flex; justify-content:space-around; text-align:center; }
.profile-stats .stat .num { font-size:22px; font-weight:700; color:#1a1a1a; }
.profile-stats .stat .label { font-size:13px; color:#999; margin-top:2px; }
.profile-name-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.profile-name { font-size:20px; font-weight:700; color:#1a1a1a; }
.profile-tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; }
.profile-bio-text { font-size:14px; color:#666; margin-bottom:16px; line-height:1.6; }

.tabs { display:flex; gap:24px; margin-bottom:16px; border-bottom:1px solid rgba(0,0,0,.06); padding-bottom:0; }
.tabs .tab { font-size:16px; color:#999; padding:8px 0; position:relative; cursor:pointer; font-weight:500; }
.tabs .tab.active { color:#1a1a1a; font-weight:700; }
.tabs .tab.active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:3px; background:#333; border-radius:2px; }

.work-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.work-card { background:#fff; border-radius:16px; overflow:hidden; aspect-ratio:1; box-shadow:0 2px 10px rgba(0,0,0,.05); position:relative; }
.work-card img { width:100%; height:100%; object-fit:cover; }
.work-card .work-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; background:#f8f9fb; }
.work-empty { grid-column:1/-1; text-align:center; padding:40px 20px; color:#bbb; font-size:14px; }

.bottom-nav { position:fixed; bottom:12px; left:12px; right:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; display:flex; justify-content:space-around; align-items:center; padding:10px 8px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); box-shadow:0 4px 20px rgba(0,0,0,.08); z-index:200; }
.bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 4px; color:#999; font-size:11px; text-decoration:none; border-radius:16px; transition:all .2s; }
.bottom-nav a .icon { font-size:22px; margin-bottom:2px; }
.bottom-nav a.active { color:#1a1a1a; background:rgba(0,0,0,.06); }
.bottom-nav a:active { opacity:.7; }
.bottom-nav .fab { flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 12px rgba(74,125,255,.4); margin:0 4px; }
.bottom-nav .fab:active { transform:scale(.95); }

.auth-page { display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:16px; }
.auth-box { background:#fff; padding:28px 24px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.15); width:100%; max-width:400px; }
.auth-box h2 { text-align:center; margin-bottom:24px; color:#333; font-size:22px; }
.auth-box input { width:100%; padding:14px 16px; margin-bottom:14px; border:1px solid #e0e0e0; border-radius:10px; font-size:16px; background:#fafafa; transition:border-color .2s,background .2s; }
.auth-box input:focus { outline:none; border-color:#667eea; background:#fff; }
.auth-box button { width:100%; padding:14px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; border-radius:10px; font-size:17px; font-weight:600; cursor:pointer; transition:transform .1s; }
.auth-box button:active { transform:scale(.98); }
.auth-box button:disabled { background:#ccc; }
.auth-box p { text-align:center; margin-top:18px; font-size:14px; color:#666; }
.auth-box a { color:#667eea; text-decoration:none; font-weight:500; }
.code-row { display:flex; gap:8px; margin-bottom:14px; }
.code-row input { flex:1; margin-bottom:0; min-width:0; }
.code-row button { width:auto; min-width:110px; white-space:nowrap; font-size:14px; padding:0 12px; background:#667eea; }
.cf-turnstile { margin-bottom:14px; display:flex; justify-content:center; }

.home-page { padding:60px 20px 20px; }
.home-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.home-subtitle { font-size:14px; color:#999; margin-bottom:20px; }
.home-card { background:rgba(255,255,255,.7); backdrop-filter:blur(10px); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
.home-card h3 { font-size:16px; margin-bottom:12px; }
.card-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.mini-card { background:#fff; border-radius:12px; padding:14px; text-align:center; }
.mini-card .icon { font-size:28px; margin-bottom:6px; }
.mini-card .title { font-size:13px; color:#555; }

.create-page { padding:60px 20px 20px; }
.create-hero { text-align:center; padding:30px 0; }
.create-hero .icon { font-size:56px; margin-bottom:12px; }
.create-hero h2 { font-size:22px; margin-bottom:6px; }
.create-hero p { font-size:14px; color:#999; }

.edit-page { background:#f0f2f8; min-height:100vh; padding-bottom:30px; }
.edit-header { background:rgba(255,255,255,.8); backdrop-filter:blur(10px); padding:14px 16px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
.edit-header .back { font-size:20px; color:#333; margin-right:12px; cursor:pointer; }
.edit-header h2 { font-size:17px; font-weight:600; }
.edit-cover-upload { position:relative; width:100%; height:160px; background:#ddd; overflow:hidden; cursor:pointer; }
.edit-cover-upload img { width:100%; height:100%; object-fit:cover; }
.edit-cover-upload .overlay { position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
.edit-avatar-wrap { padding:0 16px; margin-top:-36px; position:relative; z-index:5; }
.edit-avatar-upload { width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:#ddd; overflow:hidden; cursor:pointer; position:relative; }
.edit-avatar-upload img { width:100%; height:100%; object-fit:cover; }
.edit-avatar-upload .overlay { position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
.edit-form { padding:16px; }
.edit-form label { display:block; font-size:14px; color:#666; margin-bottom:6px; margin-top:16px; }
.edit-form textarea { width:100%; padding:12px; border:1px solid #e0e0e0; border-radius:10px; font-size:15px; resize:vertical; min-height:100px; background:#fafafa; }
.edit-form textarea:focus { outline:none; border-color:#667eea; background:#fff; }
.edit-form .char-count { text-align:right; font-size:12px; color:#999; margin-top:4px; }
.edit-form .save-btn { width:100%; padding:14px; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; margin-top:20px; cursor:pointer; }
.edit-form .save-btn:active { transform:scale(.98); }
.edit-form .save-btn:disabled { background:#ccc; }

.msg { padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
.msg.error { background:#fee; color:#c33; }
.msg.success { background:#efe; color:#2a2; }
.loading { text-align:center; padding:60px 20px; color:#999; font-size:15px; }
.bio-status { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; margin-top:6px; }
.bio-status.pending { background:#fff3cd; color:#856404; }
.bio-status.rejected { background:#f8d7da; color:#721c24; }
.bio-status.approved { background:#d4edda; color:#155724; }

.id-verify-card { margin:20px 16px 0; padding:16px; background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.id-verify-card:active { background:#f8f8f8; }
.idv-left { display:flex; align-items:center; gap:12px; }
.idv-icon { width:40px; height:40px; border-radius:11px; object-fit:cover; flex-shrink:0; }
.idv-title { font-size:15px; font-weight:600; color:#333; }
.idv-status { font-size:12px; margin-top:3px; }
.idv-status.none { color:#e6a23c; }
.idv-status.pending { color:#856404; }
.idv-status.approved { color:#155724; }
.idv-status.rejected { color:#c33; }
.idv-arrow { font-size:22px; color:#ccc; }
.id-modal-box { text-align:left !important; }
.id-modal-box h3 { text-align:center; }
.id-modal-box .id-input { width:100%; padding:12px; border:1px solid #e0e0e0; border-radius:10px; font-size:15px; background:#fafafa; margin-top:12px; box-sizing:border-box; }
.id-modal-box .id-input:focus { outline:none; border-color:#667eea; background:#fff; }
.id-modal-tip { font-size:12px; color:#999; line-height:1.6; margin:12px 0 0; }
.id-result { text-align:center; padding:8px 0; }
.id-result .big { font-size:34px; margin-bottom:8px; }

@media (max-width:480px) {
  .profile-page { padding:50px 16px 16px; }
  .profile-avatar-lg { width:64px; height:64px; font-size:24px; }
  .profile-stats .stat .num { font-size:20px; }
  .profile-name { font-size:18px; }
  .work-grid { gap:10px; }
  .bottom-nav { bottom:8px; left:8px; right:8px; border-radius:20px; padding:8px 6px; }
  .bottom-nav a .icon { font-size:20px; }
  .bottom-nav .fab { width:48px; height:48px; font-size:24px; }
  .home-page,.create-page { padding:50px 16px 16px; }
}
@media (max-width:360px) {
  .code-row { flex-direction:column; }
  .code-row button { width:100%; min-width:0; padding:12px; }
}

</style>
</head>
<body class="edit-page">
<div class="edit-header">
  <span class="back" onclick="history.back()">←</span>
  <h2>编辑个人资料</h2>
</div>

<div id="msg" style="margin:12px 16px 0"></div>

<div class="edit-cover-upload" onclick="document.getElementById('coverInput').click()">
  <img id="coverPreview" style="display:none" alt="封面预览">
  <div class="overlay" id="coverOverlay">点击上传封面</div>
</div>
<input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCover(event)">

<div class="edit-avatar-wrap">
  <div class="edit-avatar-upload" onclick="document.getElementById('avatarInput').click()">
    <img id="avatarPreview" style="display:none" alt="头像预览">
    <div class="overlay" id="avatarOverlay">上传头像</div>
  </div>
</div>
<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatar(event)">

<div class="edit-form">
  <label>个人介绍</label>
  <textarea id="bioInput" placeholder="介绍一下你自己吧（不超过500字）" maxlength="500" oninput="updateCharCount()"></textarea>
  <div class="char-count"><span id="charCount">0</span>/500</div>
  <button class="save-btn" id="saveBtn" onclick="saveProfile()">确定</button>
</div>

<div class="id-verify-card" onclick="openIdModal()">
  <div class="idv-left">
    <img class="idv-icon" src="assets/verify.jpg" alt="实名认证">
    <div>
      <div class="idv-title">实名认证</div>
      <div class="idv-status none" id="idVerifyStatus">未认证</div>
    </div>
  </div>
  <span class="idv-arrow">›</span>
</div>

<div class="custom-modal" id="idModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;">
  <div class="custom-modal-box id-modal-box" style="background:#fff;border-radius:16px;padding:24px;width:82%;max-width:320px;box-shadow:0 10px 40px rgba(0,0,0,.2);">
    <h3 style="font-size:17px;margin-bottom:8px;color:#333;">实名认证</h3>
    <div id="idFormArea">
      <input class="id-input" id="realNameInput" placeholder="请输入真实姓名" maxlength="20">
      <input class="id-input" id="idCardInput" placeholder="请输入身份证号码" maxlength="18" style="letter-spacing:1px;">
      <div id="idFormError" style="color:#e74c3c;font-size:13px;margin-top:10px;line-height:1.5;display:none;"></div>
      <p class="id-modal-tip">信息仅用于身份核验并加密存储，不会公开显示。提交后将在24小时内完成审核。</p>
      <div class="custom-modal-btns" style="display:flex;gap:10px;justify-content:center;margin-top:18px;">
        <button onclick="closeIdModal()" style="padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:#f0f0f0;color:#666;">取消</button>
        <button id="idSubmitBtn" onclick="submitIdentity()" style="padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#4a7dff,#3b5fe0);color:#fff;">提交</button>
      </div>
    </div>
    <div id="idResultArea" style="display:none;">
      <div class="id-result">
        <img id="idResultIcon" src="assets/verify.jpg" alt="" style="width:76px;height:76px;border-radius:18px;object-fit:cover;margin:0 auto 12px;display:block;box-shadow:0 8px 22px rgba(102,126,234,.25)">
        <div id="idResultText" style="font-size:15px;color:#333;font-weight:600;margin-bottom:6px;"></div>
        <div id="idResultSub" style="font-size:13px;color:#999;line-height:1.6;"></div>
      </div>
      <div class="custom-modal-btns" style="display:flex;gap:10px;justify-content:center;margin-top:18px;">
        <button onclick="closeIdModal()" style="padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#4a7dff,#3b5fe0);color:#fff;">确定</button>
      </div>
    </div>
  </div>
</div>

<input type="hidden" id="avatarBase64" value="">
<input type="hidden" id="coverBase64" value="">

<script>
let currentAvatar='',currentCover='';
function showMsg(text,type){
  const el=document.getElementById('msg');
  el.innerHTML='<div class="msg '+type+'">'+text+'</div>';
}
function updateCharCount(){
  document.getElementById('charCount').textContent=document.getElementById('bioInput').value.length;
}
function compressImage(file,maxWidth,callback){
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxWidth){h=h*maxWidth/w;w=maxWidth;}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.8));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleAvatar(e){
  const file=e.target.files[0];
  if(!file)return;
  compressImage(file,300,function(base64){
    currentAvatar=base64;
    document.getElementById('avatarPreview').src=base64;
    document.getElementById('avatarPreview').style.display='block';
    document.getElementById('avatarOverlay').style.display='none';
  });
}
function handleCover(e){
  const file=e.target.files[0];
  if(!file)return;
  compressImage(file,800,function(base64){
    currentCover=base64;
    document.getElementById('coverPreview').src=base64;
    document.getElementById('coverPreview').style.display='block';
    document.getElementById('coverOverlay').style.display='none';
  });
}
async function loadCurrent(){
  try{
    const r=await fetch('/api/user',{credentials:'include'});
    const d=await r.json();
    if(!d.success){location.href='login.html';return;}
    const u=d.user;
    if(u.bio){
      document.getElementById('bioInput').value=u.bio;
      updateCharCount();
    }
    if(u.avatar&&u.avatar.startsWith('data:')){
      currentAvatar=u.avatar;
      document.getElementById('avatarPreview').src=u.avatar;
      document.getElementById('avatarPreview').style.display='block';
      document.getElementById('avatarOverlay').style.display='none';
    }
    if(u.cover&&u.cover.startsWith('data:')){
      currentCover=u.cover;
      document.getElementById('coverPreview').src=u.cover;
      document.getElementById('coverPreview').style.display='block';
      document.getElementById('coverOverlay').style.display='none';
    }
  }catch(e){}
}
async function saveProfile(){
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;
  btn.textContent='保存中...';
  try{
    const r=await fetch('/api/update_profile',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({
        bio:document.getElementById('bioInput').value,
        avatar:currentAvatar,
        cover:currentCover
      })
    });
    const d=await r.json();
    if(d.success){
      if(d.bio_status==='rejected'){
        showMsg('保存成功，但介绍未通过审核：'+d.bio_error,'error');
      }else{
        showMsg('保存成功！','success');
        setTimeout(()=>location.href='profile.html',1000);
      }
    }else{
      showMsg(d.message,'error');
    }
  }catch(e){
    showMsg('保存失败，请重试','error');
  }
  btn.disabled=false;
  btn.textContent='确定';
}
let idStatus='none';
async function loadIdentity(){
  try{
    const r=await fetch('/api/get_identity',{credentials:'include'});
    const d=await r.json();
    const el=document.getElementById('idVerifyStatus');
    el.classList.remove('none','pending','approved','rejected');
    if(d.success&&d.verified&&(d.status==='approved'||d.status==='pending'||d.status==='rejected')){
      idStatus=d.status;
      if(d.status==='approved'){ el.textContent='已认证'; el.classList.add('approved'); }
      else if(d.status==='pending'){ el.textContent='审核中（24小时内）'; el.classList.add('pending'); }
      else { el.textContent='未通过，点击重新提交'; el.classList.add('rejected'); }
    }else{
      idStatus='none';
      el.textContent='未认证'; el.classList.add('none');
    }
  }catch(e){}
}
function openIdModal(){
  const modal=document.getElementById('idModal');
  const form=document.getElementById('idFormArea');
  const result=document.getElementById('idResultArea');
  document.getElementById('idFormError').style.display='none';
  if(idStatus==='pending'){
    form.style.display='none'; result.style.display='block';
    document.getElementById('idResultText').textContent='审核中';
    document.getElementById('idResultSub').textContent='你的实名认证正在审核，将在24小时内完成';
  }else if(idStatus==='approved'){
    form.style.display='none'; result.style.display='block';
    document.getElementById('idResultText').textContent='已完成实名认证';
    document.getElementById('idResultSub').textContent='你的账号已通过实名认证';
  }else{
    form.style.display='block'; result.style.display='none';
    document.getElementById('realNameInput').value='';
    document.getElementById('idCardInput').value='';
  }
  modal.style.display='flex';
}
function closeIdModal(){
  document.getElementById('idModal').style.display='none';
}
function showIdError(msg){
  const e=document.getElementById('idFormError');
  e.textContent=msg; e.style.display='block';
}
async function submitIdentity(){
  const realName=document.getElementById('realNameInput').value.trim();
  const idCard=document.getElementById('idCardInput').value.trim().toUpperCase();
  document.getElementById('idFormError').style.display='none';
  if(!realName){ showIdError('请输入真实姓名'); return; }
  if(!idCard){ showIdError('请输入身份证号码'); return; }
  const btn=document.getElementById('idSubmitBtn');
  btn.disabled=true; btn.textContent='提交中...';
  try{
    const r=await fetch('/api/submit_identity',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({real_name:realName,id_card:idCard})
    });
    const d=await r.json();
    if(d.success){
      document.getElementById('idFormArea').style.display='none';
      document.getElementById('idResultArea').style.display='block';
      document.getElementById('idResultText').textContent='提交成功';
      document.getElementById('idResultSub').textContent='将在24小时内完成审核，请耐心等待';
      idStatus='pending';
      loadIdentity();
    }else{
      showIdError(d.message||'提交失败，请重试');
    }
  }catch(e){
    showIdError('提交失败，请重试');
  }
  btn.disabled=false; btn.textContent='提交';
}
loadIdentity();
loadCurrent();
</script>
</body>
</html>
