<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>忘记密码 - 创造工坊</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; }
input,button { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }
.auth-page { display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:16px; }
.auth-box { background:#fff; padding:28px 24px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.15); width:100%; max-width:400px; }
.auth-box h2 { text-align:center; margin-bottom:8px; color:#333; font-size:22px; }
.auth-box .sub { text-align:center; color:#999; font-size:13px; margin-bottom:20px; }
.auth-box input { width:100%; padding:14px 16px; margin-bottom:14px; border:1px solid #e0e0e0; border-radius:10px; font-size:16px; background:#fafafa; transition:border-color .2s,background .2s; }
.auth-box input:focus { outline:none; border-color:#667eea; background:#fff; }
.auth-box button { width:100%; padding:14px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; border-radius:10px; font-size:17px; font-weight:600; cursor:pointer; transition:transform .1s; }
.auth-box button:active { transform:scale(.98); }
.auth-box button:disabled { background:#ccc; }
.auth-box p { text-align:center; margin-top:18px; font-size:14px; color:#666; }
.auth-box a { color:#667eea; text-decoration:none; font-weight:500; }
.code-row { display:flex; gap:8px; margin-bottom:14px; }
.code-row input { flex:1; margin-bottom:0; min-width:0; }
.code-row button { width:auto; min-width:110px; white-space:nowrap; font-size:14px; padding:0 12px; background:#667eea; }
.msg { padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
.msg.error { background:#fee; color:#c33; }
.msg.success { background:#efe; color:#2a2; }
.custom-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
.custom-modal.show { display:flex; }
.custom-modal-box { background:#fff; border-radius:16px; padding:24px; width:80%; max-width:300px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.2); }
.custom-modal-box h3 { font-size:17px; margin-bottom:12px; color:#333; }
.custom-modal-box p { font-size:14px; color:#666; margin-bottom:20px; line-height:1.5; }
.custom-modal-btns { display:flex; gap:10px; justify-content:center; }
.custom-modal-btns button { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.custom-modal-btns .btn-ok { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
</style>
</head>
<body class="auth-page">
<div class="custom-modal" id="customModal">
  <div class="custom-modal-box">
    <h3 id="modalTitle">提示</h3>
    <p id="modalText"></p>
    <div class="custom-modal-btns"><button class="btn-ok" onclick="closeModal()">确定</button></div>
  </div>
</div>
<div class="auth-box">
  <h2>忘记密码</h2>
  <div class="sub">输入注册邮箱，接收验证码重置密码</div>
  <div id="msg"></div>
  <input type="email" id="email" placeholder="注册邮箱" required>
  <div class="code-row">
    <input type="text" id="code" placeholder="邮箱验证码" maxlength="6">
    <button type="button" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
  </div>
  <button onclick="nextStep()">下一步</button>
  <p>想起密码了？<a href="login.html">返回登录</a></p>
</div>
<script>
let countdown=0;
function showMsg(text,type){
  document.getElementById('msg').innerHTML='<div class="msg '+type+'">'+text+'</div>';
}
function showAlert(text,title){
  document.getElementById('modalTitle').textContent=title||'提示';
  document.getElementById('modalText').textContent=text;
  document.getElementById('customModal').classList.add('show');
}
function closeModal(){
  document.getElementById('customModal').classList.remove('show');
}
async function sendCode(){
  const email=document.getElementById('email').value.trim();
  if(!email){showMsg('请输入邮箱','error');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showMsg('邮箱格式不正确','error');return;}
  const btn=document.getElementById('sendCodeBtn');
  btn.disabled=true;
  btn.textContent='发送中...';
  try{
    const r=await fetch('/api/send_reset_code',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email})
    });
    const d=await r.json();
    if(d.success){
      showMsg(d.message,'success');
      countdown=60;
      const timer=setInterval(()=>{
        countdown--;
        if(countdown<=0){clearInterval(timer);btn.disabled=false;btn.textContent='发送验证码';}
        else{btn.textContent=countdown+'秒后重发';}
      },1000);
    }else{
      showMsg(d.message,'error');
      btn.disabled=false;
      btn.textContent='发送验证码';
    }
  }catch(e){
    showMsg('发送失败，请重试','error');
    btn.disabled=false;
    btn.textContent='发送验证码';
  }
}
async function nextStep(){
  const email=document.getElementById('email').value.trim();
  const code=document.getElementById('code').value.trim();
  if(!email){showMsg('请输入邮箱','error');return;}
  if(!code){showMsg('请输入验证码','error');return;}
  try{
    const r=await fetch('/api/verify_reset_code',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,code:code})
    });
    const d=await r.json();
    if(d.success){
      location.href='reset-password.html?email='+encodeURIComponent(email)+'&code='+code;
    }else{
      showMsg(d.message,'error');
    }
  }catch(e){
    showMsg('验证失败，请重试','error');
  }
}
</script>
</body>
</html>
