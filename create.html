<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>创作游戏 - 创造工坊</title>
<script src="assets/auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; background:#f0f2f8; }
input,button,textarea { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }
.app-bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(135deg,#e8ecf5 0%,#f0f2f8 40%,#f5f0f8 100%); overflow:hidden; }
.app-bg::before { content:''; position:absolute; top:-100px; right:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(120,140,255,.25) 0%,transparent 70%); border-radius:50%; }
.edit-header { background:rgba(255,255,255,.85); backdrop-filter:blur(10px); padding:14px 16px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
.edit-header .back { font-size:20px; color:#333; margin-right:12px; cursor:pointer; }
.edit-header h2 { font-size:17px; font-weight:600; }
.create-form { padding:16px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:14px; color:#666; margin-bottom:8px; font-weight:500; }
.icon-upload { width:80px; height:80px; border-radius:16px; background:#fff; border:2px dashed #ccc; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative; }
.icon-upload img { width:100%; height:100%; object-fit:cover; }
.icon-upload .placeholder { font-size:32px; color:#ccc; }
.icon-upload .hint { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.5); color:#fff; font-size:10px; text-align:center; padding:2px 0; }
.form-group input[type="text"], .form-group textarea { width:100%; padding:12px 14px; border:1px solid #e0e0e0; border-radius:10px; font-size:15px; background:#fafafa; transition:border-color .2s,background .2s; }
.form-group input[type="text"]:focus, .form-group textarea:focus { outline:none; border-color:#4a7dff; background:#fff; }
.form-group textarea { resize:vertical; min-height:80px; font-family:monospace; font-size:13px; }
.form-group textarea#htmlCode { min-height:200px; }
.upload-btn { display:inline-block; padding:10px 16px; background:#e8ecf5; color:#4a7dff; border-radius:8px; font-size:14px; cursor:pointer; margin-top:8px; }
.upload-btn:active { background:#d8dce5; }
.char-count { text-align:right; font-size:12px; color:#999; margin-top:4px; }
.submit-btn { width:100%; padding:14px; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-top:10px; }
.submit-btn:active { transform:scale(.98); }
.submit-btn:disabled { background:#ccc; }
.msg { padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
.msg.error { background:#fee; color:#c33; }
.msg.success { background:#efe; color:#2a2; }
.audit-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:999; align-items:center; justify-content:center; }
.audit-box { background:#fff; border-radius:16px; padding:30px; text-align:center; width:80%; max-width:300px; }
.audit-box .spinner { width:40px; height:40px; border:4px solid #e0e0e0; border-top-color:#4a7dff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }
.audit-box p { font-size:15px; color:#333; }
.bottom-nav { position:fixed; bottom:12px; left:12px; right:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; display:flex; justify-content:space-around; align-items:center; padding:10px 8px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); box-shadow:0 4px 20px rgba(0,0,0,.08); z-index:200; }
.bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 4px; color:#999; font-size:11px; text-decoration:none; border-radius:16px; transition:all .2s; }
.bottom-nav a .icon { font-size:22px; margin-bottom:2px; }
.bottom-nav a.active { color:#1a1a1a; background:rgba(0,0,0,.06); }
.bottom-nav a:active { opacity:.7; }
.bottom-nav .fab { flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 12px rgba(74,125,255,.4); margin:0 4px; }
.bottom-nav .fab:active { transform:scale(.95); }
.create-page { padding-bottom:90px; }
</style>
</head>
<body>
<div class="app-bg"></div>
<div class="edit-header">
  <span class="back" onclick="history.back()">←</span>
  <h2 id="pageTitle">上传游戏</h2>
</div>
<div id="msg"></div>
<div class="create-form">
  <div class="form-group">
    <label>游戏图标</label>
    <div class="icon-upload" onclick="document.getElementById('iconInput').click()">
      <span class="placeholder" id="iconPlaceholder">+</span>
      <img id="iconPreview" style="display:none" alt="图标">
      <span class="hint">点击上传</span>
    </div>
    <input type="file" id="iconInput" accept="image/*" style="display:none" onchange="handleIconUpload(event)">
  </div>
  <div class="form-group">
    <label>游戏名称</label>
    <input type="text" id="gameTitle" placeholder="给你的游戏起个名字" maxlength="50">
  </div>
  <div class="form-group">
    <label>游戏介绍</label>
    <textarea id="gameDesc" placeholder="简单介绍一下你的游戏..." maxlength="500" oninput="updateCharCount()"></textarea>
    <div class="char-count" id="charCount">0/500</div>
  </div>
  <div class="form-group">
    <label>HTML代码</label>
    <textarea id="htmlCode" placeholder="粘贴你的HTML游戏代码，或点击下方上传HTML文件"></textarea>
    <span class="upload-btn" onclick="document.getElementById('htmlFileInput').click()">📁 上传HTML文件</span>
    <input type="file" id="htmlFileInput" accept=".html,.htm" style="display:none" onchange="handleHtmlUpload(event)">
  </div>
  <button class="submit-btn" id="submitBtn" onclick="submitGame()">上传游戏</button>
</div>

<div class="audit-overlay" id="auditOverlay">
  <div class="audit-box">
    <div class="spinner"></div>
    <p>正在审核内容，请稍候...</p>
  </div>
</div>

<script>
let editingId = null;
let iconBase64 = '';

const urlParams = new URLSearchParams(window.location.search);
const editId = urlParams.get('id');
if (editId) {
  editingId = editId;
  document.getElementById('pageTitle').textContent = '编辑游戏';
  document.getElementById('submitBtn').textContent = '更新游戏';
  loadGame(editId);
}

async function loadGame(id) {
  try {
    const r = await fetch('/api/game?id=' + id, { credentials: 'include' });
    const d = await r.json();
    if (d.success && d.game) {
      document.getElementById('gameTitle').value = d.game.title;
      document.getElementById('gameDesc').value = d.game.description || '';
      document.getElementById('htmlCode').value = d.game.html_code || '';
      if (d.game.icon) {
        iconBase64 = d.game.icon;
        document.getElementById('iconPreview').src = d.game.icon;
        document.getElementById('iconPreview').style.display = 'block';
        document.getElementById('iconPlaceholder').style.display = 'none';
      }
      updateCharCount();
    }
  } catch (e) {
    showMsg('加载失败', 'error');
  }
}

function showMsg(text, type) {
  document.getElementById('msg').innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
}

function updateCharCount() {
  const len = document.getElementById('gameDesc').value.length;
  document.getElementById('charCount').textContent = len + '/500';
}

function handleIconUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const size = 100;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      iconBase64 = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('iconPreview').src = iconBase64;
      document.getElementById('iconPreview').style.display = 'block';
      document.getElementById('iconPlaceholder').style.display = 'none';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function handleHtmlUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('htmlCode').value = ev.target.result;
  };
  reader.readAsText(file);
}

async function submitGame() {
  const title = document.getElementById('gameTitle').value.trim();
  const description = document.getElementById('gameDesc').value.trim();
  const htmlCode = document.getElementById('htmlCode').value.trim();
  if (!title) { showMsg('请输入游戏名称', 'error'); return; }
  if (!htmlCode) { showMsg('请输入或上传HTML代码', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';
  document.getElementById('auditOverlay').style.display = 'flex';

  const apiUrl = editingId ? '/api/update_game' : '/api/create_game';
  const body = editingId
    ? { game_id: editingId, title, description, icon: iconBase64, html_code: htmlCode }
    : { title, description, icon: iconBase64, html_code: htmlCode };

  try {
    const r = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    const d = await r.json();
    setTimeout(() => {
      document.getElementById('auditOverlay').style.display = 'none';
      if (d.success) {
        if (d.status === 'rejected') {
          showMsg('上传成功，但内容未通过审核：' + d.reject_reason, 'error');
        } else {
          showMsg(editingId ? '更新成功' : '上传成功', 'success');
        }
        setTimeout(() => location.href = 'profile.html', 1000);
      } else {
        showMsg(d.message, 'error');
        btn.disabled = false;
        btn.textContent = editingId ? '更新游戏' : '上传游戏';
      }
    }, 1500);
  } catch (e) {
    document.getElementById('auditOverlay').style.display = 'none';
    showMsg('提交失败，请重试', 'error');
    btn.disabled = false;
    btn.textContent = editingId ? '更新游戏' : '上传游戏';
  }
}
</script>
<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>主页</a>
  <a href="create.html" class="fab active">+</a>
  <a href="profile.html"><span class="icon">👤</span>我的</a>
</nav>
</body>
</html>
