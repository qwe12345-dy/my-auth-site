<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人中心 - Cloudflare Auth</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">Cloudflare Auth</div>
  <nav>
    <a href="index.html">首页</a>
    <a href="profile.html">个人中心</a>
    <a href="#" onclick="doLogout();return false;">退出登录</a>
  </nav>
</header>
<main class="container">
  <div id="loading" class="loading">加载中...</div>
  <div id="profileCard" class="profile-card" style="display:none">
    <div class="avatar" id="userAvatar"></div>
    <h2 id="userName"></h2>
    <p>用户ID：<span id="userId"></span></p>
    <p>邮箱：<span id="userEmail"></span></p>
    <p>个人简介：<span id="userBio">暂无</span></p>
    <p>注册时间：<span id="userTime"></span></p>
  </div>
</main>
<script>
async function loadProfile(){
  try{
    const r=await fetch('/api/user',{credentials:'include'});
    const d=await r.json();
    if(!d.success){
      location.href='login.html';
      return;
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('profileCard').style.display='block';
    document.getElementById('userAvatar').textContent=d.user.username.charAt(0).toUpperCase();
    document.getElementById('userName').textContent=d.user.username;
    document.getElementById('userId').textContent=d.user.id;
    document.getElementById('userEmail').textContent=d.user.email;
    document.getElementById('userBio').textContent=d.user.bio||'暂无';
    document.getElementById('userTime').textContent=d.user.created_at;
  }catch(e){
    document.getElementById('loading').textContent='加载失败，请刷新重试';
  }
}
async function doLogout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  location.href='login.html';
}
loadProfile();
</script>
</body>
</html>
