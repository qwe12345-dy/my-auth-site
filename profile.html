<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的 - 创造工坊</title>
<script src="assets/auth.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:#1a1a1a; min-height:100vh; font-size:16px; line-height:1.5; padding-bottom:90px; background:#f0f2f8; }
input,button,textarea { font-family:inherit; font-size:16px; }
a { text-decoration:none; color:inherit; }
.app-bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(135deg,#e8ecf5 0%,#f0f2f8 40%,#f5f0f8 100%); overflow:hidden; }
.app-bg::before { content:''; position:absolute; top:-100px; right:-80px; width:300px; height:300px; background:radial-gradient(circle,rgba(120,140,255,.25) 0%,transparent 70%); border-radius:50%; }
.app-bg::after { content:''; position:absolute; bottom:100px; left:-60px; width:280px; height:280px; background:radial-gradient(circle,rgba(255,200,120,.2) 0%,transparent 70%); border-radius:50%; }
.hamburger { position:absolute; top:16px; left:16px; width:32px; height:32px; display:flex; flex-direction:column; justify-content:center; gap:5px; cursor:pointer; z-index:10; }
.hamburger span { display:block; width:22px; height:2.5px; background:#fff; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.profile-cover { width:100%; height:180px; background:linear-gradient(135deg,#667eea,#764ba2); position:relative; overflow:hidden; }
.profile-cover img { width:100%; height:100%; object-fit:cover; }
.profile-body { padding:0 20px 20px; position:relative; margin-top:-36px; }
.profile-top { display:flex; align-items:flex-end; gap:16px; margin-bottom:14px; }
.profile-avatar-lg { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#fff; flex-shrink:0; overflow:hidden; border:3px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.1); }
.profile-avatar-lg img { width:100%; height:100%; object-fit:cover; }
.profile-stats { flex:1; display:flex; justify-content:space-around; text-align:center; padding-bottom:8px; }
.profile-stats .stat .num { font-size:20px; font-weight:700; color:#1a1a1a; }
.profile-stats .stat .label { font-size:12px; color:#999; margin-top:2px; }
.profile-name { font-size:20px; font-weight:700; color:#1a1a1a; margin-bottom:4px; }
.profile-bio-text { font-size:14px; color:#666; margin-bottom:12px; line-height:1.6; }
.tabs { display:flex; gap:24px; margin-bottom:14px; border-bottom:1px solid rgba(0,0,0,.06); }
.tabs .tab { font-size:16px; color:#999; padding:8px 0; position:relative; cursor:pointer; font-weight:500; }
.tabs .tab.active { color:#1a1a1a; font-weight:700; }
.tabs .tab.active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:3px; background:#333; border-radius:2px; }
.work-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.work-card { background:#fff; border-radius:16px; overflow:hidden; aspect-ratio:1; box-shadow:0 2px 10px rgba(0,0,0,.05); position:relative; cursor:pointer; }
.work-card .work-icon { width:100%; height:70%; display:flex; align-items:center; justify-content:center; font-size:40px; background:#f8f9fb; overflow:hidden; }
.work-card .work-icon img { width:100%; height:100%; object-fit:cover; }
.work-card .work-info { padding:8px 10px; }
.work-card .work-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.work-card .work-meta { font-size:11px; color:#999; margin-top:2px; }
.work-card .reject-badge { position:absolute; top:8px; left:8px; background:#e74c3c; color:#fff; font-size:10px; padding:2px 8px; border-radius:4px; cursor:pointer; z-index:5; }
.work-empty { grid-column:1/-1; text-align:center; padding:40px 20px; color:#bbb; font-size:14px; }
.bottom-nav { position:fixed; bottom:12px; left:12px; right:12px; background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:24px; display:flex; justify-content:space-around; align-items:center; padding:10px 8px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); box-shadow:0 4px 20px rgba(0,0,0,.08); z-index:200; }
.bottom-nav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 4px; color:#999; font-size:11px; text-decoration:none; border-radius:16px; transition:all .2s; }
.bottom-nav a .icon { font-size:22px; margin-bottom:2px; }
.bottom-nav a.active { color:#1a1a1a; background:rgba(0,0,0,.06); }
.bottom-nav a:active { opacity:.7; }
.bottom-nav .fab { flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 12px rgba(74,125,255,.4); margin:0 4px; }
.bottom-nav .fab:active { transform:scale(.95); }
.msg { padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
.msg.error { background:#fee; color:#c33; }
.loading { text-align:center; padding:60px 20px; color:#999; font-size:15px; }
.bio-status { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; margin-bottom:8px; }
.bio-status.rejected { background:#f8d7da; color:#721c24; }
.work-action-menu { position:fixed; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.15); padding:6px 0; z-index:300; display:none; min-width:120px; }
.work-action-menu button { display:block; width:100%; padding:10px 16px; border:none; background:none; font-size:14px; cursor:pointer; text-align:left; }
.work-action-menu button.edit { color:#333; }
.work-action-menu button.del { color:#e74c3c; }
.custom-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
.custom-modal.show { display:flex; }
.custom-modal-box { background:#fff; border-radius:16px; padding:24px; width:80%; max-width:300px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.2); }
.custom-modal-box h3 { font-size:17px; margin-bottom:12px; color:#333; }
.custom-modal-box p { font-size:14px; color:#666; margin-bottom:20px; line-height:1.5; }
.custom-modal-btns { display:flex; gap:10px; justify-content:center; }
.custom-modal-btns button { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.custom-modal-btns .btn-ok { background:linear-gradient(135deg,#4a7dff,#3b5fe0); color:#fff; }
.custom-modal-btns .btn-cancel { background:#f0f0f0; color:#666; }
.custom-modal-btns .btn-danger { background:#e74c3c; color:#fff; }
</style>
</head>
<body>
<div class="app-bg"></div>
<div class="custom-modal" id="customModal">
  <div class="custom-modal-box">
    <h3 id="modalTitle">提示</h3>
    <p id="modalText"></p>
    <div class="custom-modal-btns" id="modalBtns"></div>
  </div>
</div>

<div class="hamburger" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</div>

<div id="sidebarMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;" onclick="toggleSidebar()"></div>
<div id="sidebar" style="position:fixed;top:0;left:-260px;width:260px;height:100%;background:#fff;z-index:301;transition:left .3s;padding:60px 20px 20px;box-shadow:2px 0 20px rgba(0,0,0,.1);">
  <div style="font-size:18px;font-weight:700;margin-bottom:24px;">菜单</div>
  <a href="edit-profile.html" style="display:block;padding:14px 0;border-bottom:1px solid #f0f0f0;font-size:15px;color:#333;">个人资料</a>
  <a href="docs.html" style="display:block;padding:14px 0;border-bottom:1px solid #f0f0f0;font-size:15px;color:#333;">接口使用</a>
  <a href="#" onclick="doLogout();return false;" style="display:block;padding:14px 0;border-bottom:1px solid #f0f0f0;font-size:15px;color:#e74c3c;">退出登录</a>
</div>

<div id="loading" class="loading">加载中...</div>

<div id="profileContent" style="display:none">
  <div class="profile-cover" id="coverBox">
    <img id="coverImg" style="display:none" alt="封面">
  </div>
  <div class="profile-body">
    <div class="profile-top">
      <div class="profile-avatar-lg" id="avatarBox">
        <img id="avatarImg" style="display:none" alt="头像">
        <span id="avatarText"></span>
      </div>
      <div class="profile-stats">
        <div class="stat"><div class="num">0</div><div class="label">关注</div></div>
        <div class="stat"><div class="num">0</div><div class="label">粉丝</div></div>
        <div class="stat"><div class="num" id="workCount">0</div><div class="label">作品</div></div>
      </div>
    </div>
    <div class="profile-name" id="userName"></div>
    <div class="profile-bio-text" id="userBio"></div>
    <div id="bioStatusBox"></div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('works',this)">作品</div>
      <div class="tab" onclick="switchTab('dynamic',this)">动态</div>
    </div>

    <div id="worksTab">
      <div class="work-grid" id="workGrid">
        <div class="work-empty">还没有作品，去创作吧</div>
      </div>
    </div>
    <div id="dynamicTab" style="display:none">
      <div class="work-empty">暂无动态</div>
    </div>
  </div>
</div>

<div class="work-action-menu" id="workActionMenu">
  <button class="edit" onclick="editGame()">✏️ 更新与编辑</button>
  <button class="del" onclick="deleteGame()">🗑️ 删除作品</button>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>主页</a>
  <a href="create.html" class="fab">+</a>
  <a href="profile.html" class="active"><span class="icon">👤</span>我的</a>
</nav>

<script>
let currentUserId = null;
let selectedGameId = null;
let pressTimer = null;

function showAlert(text, title) {
  document.getElementById('modalTitle').textContent = title || '提示';
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalBtns').innerHTML = '<button class="btn-ok" onclick="closeModal()">确定</button>';
  document.getElementById('customModal').classList.add('show');
}
function showConfirm(text, onOk, title) {
  document.getElementById('modalTitle').textContent = title || '确认';
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalBtns').innerHTML =
    '<button class="btn-cancel" onclick="closeModal()">取消</button>' +
    '<button class="btn-danger" id="confirmOkBtn">确定</button>';
  document.getElementById('customModal').classList.add('show');
  document.getElementById('confirmOkBtn').onclick = function() {
    closeModal();
    if (onOk) onOk();
  };
}
function closeModal() {
  document.getElementById('customModal').classList.remove('show');
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const mask=document.getElementById('sidebarMask');
  if(sb.style.left==='0px'){sb.style.left='-260px';mask.style.display='none';}
  else{sb.style.left='0px';mask.style.display='block';}
}
function switchTab(tab,el){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('worksTab').style.display=tab==='works'?'block':'none';
  document.getElementById('dynamicTab').style.display=tab==='dynamic'?'block':'none';
}

async function loadProfile(){
  try{
    const r=await fetch('/api/user',{credentials:'include'});
    const d=await r.json();
    if(!d.success){location.href='login.html';return;}
    const u=d.user;
    currentUserId=u.id;
    document.getElementById('loading').style.display='none';
    document.getElementById('profileContent').style.display='block';
    document.getElementById('userName').textContent=u.username;
    if(u.avatar&&u.avatar.startsWith('data:')){
      document.getElementById('avatarImg').src=u.avatar;
      document.getElementById('avatarImg').style.display='block';
      document.getElementById('avatarText').style.display='none';
    }else{
      document.getElementById('avatarText').textContent=u.username.charAt(0).toUpperCase();
    }
    if(u.cover&&u.cover.startsWith('data:')){
      document.getElementById('coverImg').src=u.cover;
      document.getElementById('coverImg').style.display='block';
    }
    if(u.bio&&u.bio.trim()){
      document.getElementById('userBio').textContent=u.bio;
    }else{
      document.getElementById('userBio').textContent='这个人很懒，什么都没写';
    }
    const sb=document.getElementById('bioStatusBox');
    if(u.bio_status==='rejected'){
      sb.innerHTML='<div class="bio-status rejected">介绍未通过：'+(u.bio_error||'')+'</div>';
    }
    loadGames();
  }catch(e){
    document.getElementById('loading').textContent='加载失败，请刷新';
  }
}

async function loadGames(){
  try{
    const r=await fetch('/api/games?user_id='+currentUserId,{credentials:'include'});
    const d=await r.json();
    const grid=document.getElementById('workGrid');
    if(!d.success||d.games.length===0){
      grid.innerHTML='<div class="work-empty">还没有作品，去创作吧</div>';
      document.getElementById('workCount').textContent='0';
      return;
    }
    document.getElementById('workCount').textContent=d.games.length;
    grid.innerHTML=d.games.map(g=>{
      const iconHtml=g.icon?'<img src="'+g.icon+'">':'<span>🎮</span>';
      const rejectBadge=g.status==='rejected'?'<div class="reject-badge" onclick="event.stopPropagation();showReject(\''+(g.reject_reason||'').replace(/'/g,"\\'")+'\')">违规</div>':'';
      return '<div class="work-card" data-id="'+g.id+'" onclick="openGame('+g.id+')">'+
        rejectBadge+
        '<div class="work-icon">'+iconHtml+'</div>'+
        '<div class="work-info">'+
          '<div class="work-title">'+escapeHtml(g.title)+'</div>'+
          '<div class="work-meta">❤️'+g.likes_count+' 💬'+g.comments_count+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
    grid.querySelectorAll('.work-card').forEach(card=>{
      card.addEventListener('touchstart',handleLongPress);
      card.addEventListener('mousedown',handleLongPress);
    });
  }catch(e){}
}

function escapeHtml(text){
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}

function handleLongPress(e){
  const card=e.currentTarget;
  const id=card.dataset.id;
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{
    selectedGameId=id;
    const menu=document.getElementById('workActionMenu');
    const rect=card.getBoundingClientRect();
    menu.style.display='block';
    menu.style.left=Math.min(rect.left,window.innerWidth-140)+'px';
    menu.style.top=(rect.bottom+8)+'px';
    setTimeout(()=>{menu.style.display='none';},2500);
  },500);
}
document.addEventListener('touchend',()=>clearTimeout(pressTimer));
document.addEventListener('mouseup',()=>clearTimeout(pressTimer));
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.work-action-menu')){
    document.getElementById('workActionMenu').style.display='none';
  }
});

function openGame(id){
  if(pressTimer){clearTimeout(pressTimer);}
  location.href='game.html?id='+id;
}

function editGame(){
  document.getElementById('workActionMenu').style.display='none';
  location.href='create.html?id='+selectedGameId;
}

async function deleteGame(){
  document.getElementById('workActionMenu').style.display='none';
  showConfirm('确定删除这个作品？删除后不可恢复', function(){
    fetch('/api/delete_game',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({game_id:selectedGameId})
    }).then(r=>r.json()).then(d=>{
      if(d.success){loadGames();}
      else{showAlert(d.message);}
    });
  });
}

function showReject(reason){
  showAlert('违规原因：'+(reason||'内容不符合规范'), '违规详情');
}

async function doLogout(){
  await fetch('/api/logout',{method:'POST',credentials:'include'});
  location.href='login.html';
}

loadProfile();
</script>
</body>
</html>
