<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - Cloudflare Auth</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
.turnstile-disabled{display:none!important;}
</style>
</head>
<body class="auth-page">
<div class="auth-box">
  <h2>登录</h2>
  <div id="msg"></div>
  <form onsubmit="doLogin(event)">
    <input type="text" id="account" placeholder="用户名 / 邮箱" required>
    <input type="password" id="password" placeholder="密码" required>
    <div class="cf-turnstile" id="turnstileWidget" data-sitekey="0x4AAAAAAEz9gJvM8g1yxAIv"></div>
    <button type="submit">登录</button>
  </form>
  <p>还没有账号？<a href="register.html">去注册</a></p>
</div>
<script>
const TURNSTILE_SITE_KEY='0x4AAAAAAEz9gJvM8g1yxAIv';
const turnstileEnabled=TURNSTILE_SITE_KEY&&TURNSTILE_SITE_KEY!=='YOUR_TURNSTILE_SITE_KEY';
if(!turnstileEnabled){
  document.getElementById('turnstileWidget').classList.add('turnstile-disabled');
}
function showMsg(text,type){
  const el=document.getElementById('msg');
  el.innerHTML='<div class="msg '+type+'">'+text+'</div>';
}
function getTurnstileToken(){
  if(!turnstileEnabled)return '';
  if(typeof turnstile!=='undefined'&&turnstile.getResponse){
    return turnstile.getResponse();
  }
  return '';
}
async function doLogin(e){
  e.preventDefault();
  if(turnstileEnabled){
    const token=getTurnstileToken();
    if(!token){showMsg('请先完成人机验证','error');return;}
  }
  const r=await fetch('/api/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({
      account:document.getElementById('account').value,
      password:document.getElementById('password').value,
      turnstile_token:getTurnstileToken()
    })
  });
  const d=await r.json();
  if(d.success){
    showMsg('登录成功，正在跳转...','success');
    setTimeout(()=>location.href='index.html',800);
  }else{
    showMsg(d.message,'error');
  }
}
</script>
</body>
</html>
